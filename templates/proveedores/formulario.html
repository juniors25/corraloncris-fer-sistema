{% extends 'base.html' %}

{% block title %}{% if proveedor %}Editar{% else %}Nuevo{% endif %} Proveedor - Ferretería Corralón{% endblock %}

{% block content %}
<h2 style="margin-bottom: 1.5rem;">{% if proveedor %}Editar{% else %}Nuevo{% endif %} Proveedor</h2>

<div class="card">
    <form method="post">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="nombre">Nombre del Proveedor: *</label>
                <input type="text" id="nombre" name="nombre" value="{% if proveedor %}{{ proveedor.nombre }}{% endif %}" required>
            </div>
            
            <div class="form-group">
                <label for="cuit">CUIT:</label>
                <input type="text" id="cuit" name="cuit" value="{% if proveedor %}{{ proveedor.cuit }}{% endif %}">
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" value="{% if proveedor %}{{ proveedor.telefono }}{% endif %}">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{% if proveedor %}{{ proveedor.email }}{% endif %}">
            </div>
            
            <div class="form-group">
                <label for="contacto_principal">Contacto Principal:</label>
                <input type="text" id="contacto_principal" name="contacto_principal" value="{% if proveedor %}{{ proveedor.contacto_principal }}{% endif %}">
            </div>
            
            <div class="form-group">
                <label for="codigo_postal">Código Postal:</label>
                <input type="text" id="codigo_postal" name="codigo_postal" value="{% if proveedor %}{{ proveedor.codigo_postal }}{% endif %}">
            </div>
        </div>
        
        <div class="form-group">
            <label for="direccion">Dirección:</label>
            <textarea id="direccion" name="direccion" rows="2">{% if proveedor %}{{ proveedor.direccion }}{% endif %}</textarea>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" value="{% if proveedor %}{{ proveedor.ciudad }}{% endif %}">
            </div>
            
            <div class="form-group">
                <label for="provincia">Provincia:</label>
                <input type="text" id="provincia" name="provincia" value="{% if proveedor %}{{ proveedor.provincia }}{% endif %}">
            </div>
        </div>
        
        <div class="form-group">
            <label for="notas">Notas:</label>
            <textarea id="notas" name="notas" rows="3">{% if proveedor %}{{ proveedor.notas }}{% endif %}</textarea>
        </div>
        
        {% if proveedor %}
        <div class="form-group">
            <label>
                <input type="checkbox" name="activo" {% if proveedor.activo %}checked{% endif %}>
                Proveedor Activo
            </label>
        </div>
        {% endif %}
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn">{% if proveedor %}Actualizar{% else %}Crear{% endif %} Proveedor</button>
            <a href="{% url 'lista_proveedores' %}" class="btn btn-danger">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
